name: Production Site Smoke Test

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    name: Verify Deployed GitHub Pages Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Verify Production Site
        run: python scripts/check_deployed_site.py --allow-placeholder-fingerprint
