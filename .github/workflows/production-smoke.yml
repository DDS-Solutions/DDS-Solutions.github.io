name: Production Site Smoke Test

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    name: Verify Deployed GitHub Pages Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify Production Site
        run: python scripts/check_deployed_site.py --allow-placeholder-fingerprint
